name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: pytest / ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Fetch the other programs, for the real-exchange tests
        shell: bash
        run: |
          git clone --depth 1 https://github.com/nrobertson152/RevisionWorx ../RevisionWorx
          git clone --depth 1 https://github.com/nrobertson152/Caldera ../Caldera
          python -m pip install -e ../RevisionWorx
          # Python prints it: on Windows, the path bash would give (/d/a/...) means nothing to Python, and Caldera's tests were skipped
          echo "PYTHONPATH=$(python -c 'import os; print(os.path.abspath("../Caldera"))')" >> "$GITHUB_ENV"
      - name: Install Tk and Xvfb (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb python3-tk
      - name: Byte-compile
        run: python -m compileall -q fluidworx tests
      - name: Run pytest (Linux with virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m pytest -q --tb=short -ra
      - name: Run pytest (Windows)
        if: runner.os == 'Windows'
        run: python -m pytest -q --tb=short -ra
      - name: Self-test
        run: python -m fluidworx --self-test
